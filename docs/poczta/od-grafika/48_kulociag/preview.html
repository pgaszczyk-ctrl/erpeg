<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kulociąg Parowy / 48-G001</title>
<style>body{margin:0;background:#17120f;color:#ead5af;font:15px system-ui}main{max-width:1254px;margin:auto}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}header{display:flex;gap:12px;padding:12px;align-items:center;flex-wrap:wrap}button{background:#654923;color:#fff2d5;border:1px solid #bd9451;border-radius:5px;padding:9px 12px;cursor:pointer}small{color:#c6b79b}#status{padding:0 12px 12px}</style>
<main><header><b>Kulociąg / podgląd warstw</b><button id="depart">Wystrzel gracza (1)</button><button id="arrive">Przyjazd podróżnego (2)</button><label><input id="gate" type="checkbox" checked> Stacja docelowa gotowa</label><button id="again">Powtórz</button><small>Postacie zastępcze; w grze zastępuje je renderer postaci.</small></header><canvas width="1254" height="706"></canvas><div id="status">Wczytywanie…</div></main><script src="src/kulociag.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
function passenger(c,p,{time}){const red=p==='incoming';c.save();c.scale(.8,.8);const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};r(-10,-20,20,22,red?'#47788b':'#675235');r(-8,-41,16,20,'#d8a56d');r(-11,-43,22,8,red?'#a8433a':'#454d77');r(-15,-36,30,4,red?'#79372f':'#29324e');r(-5,-29,3,3,'#241d29');r(3,-29,3,3,'#241d29');r(-9,2,6,10,'#27202a');r(3,2,6,10,'#27202a');c.restore();}
let station,last=0,start=0,fired=false,incoming=false,begin=performance.now();
async function reset(){station=await new Kulociag.Station({drawPassenger:passenger}).load();last=performance.now();start=last;fired=false;incoming=false;begin=last;station.lanes[0].depart('player',{ready:document.querySelector('#gate').checked});}
document.querySelector('#depart').onclick=()=>station.lanes[0].depart('player',{ready:document.querySelector('#gate').checked});document.querySelector('#arrive').onclick=()=>station.lanes[1].arrive('incoming');document.querySelector('#again').onclick=reset;
document.querySelector('#gate').onchange=e=>station.lanes[0].setReady(e.target.checked);
function frame(now){if(station){let dt=Math.min((now-last)/1000,.1);last=now;let t=(now-start)/1000;if(t>1.5&&!fired){station.lanes[1].depart('outgoing',{ready:true});fired=true;}if(t>8&&!incoming){station.lanes[1].arrive('incoming');incoming=true;}station.update(dt);station.draw(ctx,{width:canvas.width,height:canvas.height});status.textContent=station.lanes.map(l=>'Stanowisko '+(l.id+1)+': '+l.phase).join(' · ');}requestAnimationFrame(frame);}
reset().then(()=>requestAnimationFrame(frame)).catch(e=>status.textContent=e.message);
</script></html>
