name: Deploy to GitHub Pages

# Two games and a map laboratory on one site:
#   https://exp-lore.app/       production – built from the commit named in PRODUKCJA
#   https://exp-lore.app/test/  the test server – the newest code (VITE_TEST=1)
#   https://exp-lore.app/test2/ the map laboratory – shares /test/ assets
# A release to production = bump WERSJA in src/version.ts (+0.001) and point PRODUKCJA at that commit
# (and empty produkcja/). A single small fix can go live alone as produkcja/<version>-<name>.patch.

on:
  push:
    branches: [main, claude/bold-gauss-peehzd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to the production commit
        run: |
          set -euo pipefail
          SHA=$(tr -d ' \n\r' < PRODUKCJA)
          echo "Production commit: $SHA"
          # Small fixes released on their own (produkcja/*.patch, in name order) go on top of it.
          mkdir -p /tmp/patches && cp produkcja/*.patch /tmp/patches/ 2>/dev/null || true
          git checkout --quiet "$SHA"
          for p in $(ls /tmp/patches/*.patch 2>/dev/null | sort); do echo "Applying $p"; git apply "$p"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production
          path: dist
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_TEST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: test
          path: dist
          retention-days: 1

  publish:
    needs: [production, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: test
          path: site/test
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: public/news
      - name: Publish the current static newspaper
        run: |
          mkdir -p site/news
          cp -a source/public/news/. site/news/
      - name: Publish the test2 laboratory using shared test assets
        run: |
          mkdir -p site/test2
          python3 - <<'PY'
          from pathlib import Path
          html = Path('site/test/test2.html').read_text()
          if '<base href="./">' not in html:
              raise SystemExit('test2 HTML is missing its expected asset base')
          html = html.replace('<base href="./">', '<base href="/test/">')
          Path('site/test2/index.html').write_text(html)
          PY
      - run: du -sh site site/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published production code
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const html = readFileSync('site/index.html','utf8');
          const entry = /<script[^>]+src="([^"]+\.js)"/.exec(html)[1];
          const path = entry.replace(/^\.\//,'').replace(/^\//,'');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const expected = hash(readFileSync('site/'+path));
          const headers = {'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 HelaReleaseCheck'};
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const r = await fetch('https://exp-lore.app/?release-check='+Date.now(),{headers,signal:AbortSignal.timeout(20000)});
              if(!r.ok || !(await r.text()).includes(path)) throw new Error('Public HTML has not reached this release');
              const code = await fetch('https://exp-lore.app/'+path,{headers,signal:AbortSignal.timeout(20000)});
              if(!code.ok || hash(Buffer.from(await code.arrayBuffer()))!==expected) throw new Error('Public JavaScript differs from the production artifact');
              console.log('PASS: exact production JavaScript published:',path,expected);
              break;
            } catch(e) {
              console.log('Public verification attempt',attempt+1,e.message);
              if(attempt===5) throw e;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
          }
          JS
