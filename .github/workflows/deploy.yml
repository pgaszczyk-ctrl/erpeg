name: Deploy to GitHub Pages

# Two games on one site:
#   https://exp-lore.app/       production – built from the commit named in PRODUKCJA
#   https://exp-lore.app/test/  the test server – the newest code (VITE_TEST=1)
# A release to production = bump WERSJA in src/version.ts (+0.001) and point PRODUKCJA at that commit
# (and empty produkcja/). A single small fix can go live alone as produkcja/<version>-<name>.patch.

on:
  push:
    branches: [main, claude/bold-gauss-peehzd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to the production commit
        run: |
          set -euo pipefail
          SHA=$(tr -d ' \n\r' < PRODUKCJA)
          echo "Production commit: $SHA"
          # Small fixes released on their own (produkcja/*.patch, in name order) go on top of it.
          mkdir -p /tmp/patches && cp produkcja/*.patch /tmp/patches/ 2>/dev/null || true
          git checkout --quiet "$SHA"
          for p in $(ls /tmp/patches/*.patch 2>/dev/null | sort); do echo "Applying $p"; git apply "$p"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production
          path: dist
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_TEST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: test
          path: dist
          retention-days: 1

  publish:
    needs: [production, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: test
          path: site/test
      - run: du -sh site site/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
