name: Deploy to GitHub Pages

# Two games and a map laboratory on one site:
#   https://exp-lore.app/       production – built from the commit named in PRODUKCJA
#   https://exp-lore.app/test/  the test server – the newest code (VITE_TEST=1)
#   https://exp-lore.app/test2/ the map laboratory – shares /test/ assets
# A release to production = bump WERSJA in src/version.ts (+0.001) and point PRODUKCJA at that commit
# (and empty produkcja/). A single small fix can go live alone as produkcja/<version>-<name>.patch.

on:
  push:
    branches: [main, claude/bold-gauss-peehzd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to the production commit
        run: |
          set -euo pipefail
          SHA=$(tr -d ' \n\r' < PRODUKCJA)
          echo "Production commit: $SHA"
          # Small fixes released on their own (produkcja/*.patch, in name order) go on top of it.
          mkdir -p /tmp/patches && cp produkcja/*.patch /tmp/patches/ 2>/dev/null || true
          git checkout --quiet "$SHA"
          for p in $(ls /tmp/patches/*.patch 2>/dev/null | sort); do echo "Applying $p"; git apply "$p"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production
          path: dist
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_TEST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: test
          path: dist
          retention-days: 1

  publish:
    needs: [production, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: test
          path: site/test
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: public/news
      - name: Publish the current static newspaper
        run: |
          mkdir -p site/news
          cp -a source/public/news/. site/news/
      - name: Publish the test2 laboratory using shared test assets
        run: |
          mkdir -p site/test2
          python3 - <<'PY'
          from pathlib import Path
          html = Path('site/test/test2.html').read_text()
          if '<base href="./">' not in html:
              raise SystemExit('test2 HTML is missing its expected asset base')
          html = html.replace('<base href="./">', '<base href="/test/">')
          Path('site/test2/index.html').write_text(html)
          PY
      - run: du -sh site site/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published TEST build
        timeout-minutes: 4
        run: |
          node --input-type=module <<'JS'
          const expected = process.env.GITHUB_SHA.slice(0, 7);
          const base = 'https://exp-lore.app/';
          async function read(path) {
            const response = await fetch(`${base}${path}?verify=${Date.now()}`, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
            return response.text();
          }
          let matched = false;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const version = JSON.parse(await read('test/version.json'));
              if (version.build?.startsWith(expected)) {
                console.log(`Published TEST: ${version.build}`);
                matched = true;
                break;
              }
              console.log(`Waiting for TEST ${expected}; received ${version.build}`);
            } catch (error) { console.log(error.message); }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!matched) throw new Error(`Public TEST did not reach ${expected}`);
          const html = await read('test/');
          const script = html.match(/<script[^>]+src="([^\"]+\.js)"/);
          if (!script || !script[1].startsWith('./assets/')) throw new Error('TEST entry script is missing');
          await read(`test/${script[1].slice(2)}`);
          console.log(`TEST HTML and entry script: HTTP 200`);
          console.log(`Production build: ${await read('version.json')}`);
          JS
