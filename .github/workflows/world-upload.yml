name: World map to Cloudflare

# Streams the newest Protomaps world map (~120 GB, one file read in small
# pieces by the game) into the Cloudflare R2 bucket erpeg-mapy, then points
# world.json at it and removes older copies. Needs the repository secrets
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY. Runs by hand and
# once a month.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 3 * *'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUCKET: erpeg-mapy
      R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the keys
        run: |
          if [ -z "$R2_KEY" ] || [ -z "$R2_SECRET" ]; then
            echo "::error::Brak kluczy Cloudflare R2 w Settings → Secrets (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY)"; exit 1
          fi
          # Whatever was pasted: just the account id, a whole endpoint address, with spaces or new lines.
          A=$(printf '%s' "$ACCOUNT" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.r2\.cloudflarestorage\.com.*$##; s#^.*dash\.cloudflare\.com/##; s#/.*$##')
          # Something around it (a label, a link): take the 32-character id out of it.
          printf '%s' "$A" | grep -Eq '^[0-9a-f]{32}$' || A=$(printf '%s' "$ACCOUNT" | grep -oiE '[0-9a-f]{32}' | head -1 | tr 'A-F' 'a-f' || true)
          # The owner's account (not secret: it is in every Cloudflare dashboard address).
          printf '%s' "$A" | grep -Eq '^[0-9a-f]{32}$' || A=f27c6c377e117ece848fa5bbecaa19d4
          if ! printf '%s' "$A" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::R2_ACCOUNT_ID nie wygląda na Account ID z Cloudflare (32 znaki 0-9 a-f). Skopiuj go z R2 → Account Details."; exit 1
          fi
          echo "::add-mask::$A"
          echo "ENDPOINT=https://$A.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          # Keys pasted with a stray space or new line.
          K=$(printf '%s' "$R2_KEY" | tr -d '[:space:]'); S=$(printf '%s' "$R2_SECRET" | tr -d '[:space:]')
          echo "::add-mask::$K"; echo "::add-mask::$S"
          echo "AWS_ACCESS_KEY_ID=$K" >> "$GITHUB_ENV"; echo "AWS_SECRET_ACCESS_KEY=$S" >> "$GITHUB_ENV"
      - name: Let the game's pages read the bucket
        # Needs an Admin token; with Object Read & Write the owner sets CORS in the dashboard instead.
        continue-on-error: true
        run: |
          cat > cors.json <<'JSON'
          {"CORSRules":[{"AllowedOrigins":["https://pgaszczyk-ctrl.github.io","http://localhost:5173","http://localhost:4173"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["range","if-match"],"ExposeHeaders":["etag","content-length","content-range"],"MaxAgeSeconds":86400}]}
          JSON
          aws s3api put-bucket-cors --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --cors-configuration file://cors.json
      - name: Check that the key may write
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          date -u > probe.txt
          if ! aws s3 cp probe.txt "s3://$BUCKET/probe.txt" --endpoint-url "$ENDPOINT"; then
            echo "::error::Klucz R2 nie może zapisywać w erpeg-mapy. W Cloudflare: R2 → Manage API tokens → utwórz klucz z uprawnieniem Object Read & Write dla erpeg-mapy i wpisz jego Access Key ID i Secret Access Key do sekretów GitHuba."; exit 1
          fi
          aws s3 rm "s3://$BUCKET/probe.txt" --endpoint-url "$ENDPOINT" || true
      - name: Copy the newest world map
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          B=$(scripts/world-latest.sh)
          URL="https://build.protomaps.com/$B"
          echo "Build: $B"
          S3="aws s3 --endpoint-url $ENDPOINT"
          if $S3 ls "s3://$BUCKET/world-$B" | grep -q "world-$B"; then
            echo "Already there"
          else
            SIZE=$(curl -sfI "$URL" | grep -i '^content-length' | tr -dc '0-9')
            echo "Size: $SIZE bytes"
            # Streamed straight through: the runner's disk is far too small for the file.
            curl -sfL --retry 5 "$URL" | $S3 cp - "s3://$BUCKET/world-$B" --expected-size "$SIZE" --no-progress
          fi
          echo "{\"file\":\"world-$B\",\"build\":\"${B%.pmtiles}\"}" > world.json
          $S3 cp world.json "s3://$BUCKET/world.json" --cache-control no-cache --content-type application/json
          # Older copies (keep the new one only).
          for f in $($S3 ls "s3://$BUCKET/" | awk '{print $4}' | grep '^world-.*\.pmtiles$' || true); do
            [ "$f" = "world-$B" ] || $S3 rm "s3://$BUCKET/$f"
          done
          $S3 ls "s3://$BUCKET/"
