name: Test2 architecture checks
on:
  pull_request:
    paths:
      - 'src/architecture/**'
      - 'src/test2/**'
      - 'src/map/**'
      - 'scripts/architecture/**'
      - 'test2.html'
      - '.github/workflows/architecture-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_TEST: '1'
      - run: npm run test:architecture
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:architecture:browser
        env:
          ARCHITECTURE_PLACES: kul,dziewanny,szczytowa,homes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test2-architecture-review
          path: |
            docs/architecture/artifacts/*-before.png
            docs/architecture/artifacts/*-after.png
            docs/architecture/artifacts/*-failure.png
            docs/architecture/artifacts/browser-results.json
            docs/architecture/artifacts/unit-results.json
          retention-days: 7
