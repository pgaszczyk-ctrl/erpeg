name: Resident and dog GLB checks
on:
  pull_request:
    paths:
      - 'src/mieszkancy3d.ts'
      - 'src/stwory3d.ts'
      - 'src/scenes/Townsfolk.ts'
      - 'src/scenes/FixedNpcs.ts'
      - 'src/scenes/Npcs.ts'
      - 'src/scenes/GameScene.ts'
      - 'public/modele/swiat44/**'
      - 'scripts/tests/browser-residents3d.mjs'
      - '.github/workflows/residents3d-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  residents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phone: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          VITE_TEST: '1'
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: node scripts/tests/browser-residents3d.mjs
        env:
          TELEFON: '${{ matrix.phone }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residents-${{ matrix.phone }}
          path: work/residents3d/
          if-no-files-found: ignore
          retention-days: 7
