name: City quest checks
on:
  pull_request:
    paths:
      - 'src/content/questy/**'
      - 'src/content/fabula.ts'
      - 'src/content/zlecenia.ts'
      - 'src/quests.ts'
      - 'src/scenes/**'
      - 'src/admin/etapyEditor.ts'
      - 'scripts/tests/**'
      - '.github/workflows/quest-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quest-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: maps
        with:
          path: |
            .cache/lublin-full.json
            public/map
          key: combat-maps-v1-${{ hashFiles('data/**/*.geojsonseq.gz', 'data/rail.json', 'data/towns.json', 'scripts/build-map*.mjs', 'scripts/split-map.mjs', 'scripts/snap-buildings.mjs', 'scripts/signposts.mjs', 'scripts/lublin-area.json', 'src/map/CityMap.ts', 'src/skala.ts') }}
      - name: Keep matching map cache current after checkout
        if: steps.maps.outputs.cache-hit == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in [Path('.cache/lublin-full.json'), Path('public/map')]:
              for p in ([root] if root.is_file() else root.rglob('*')):
                  if p.is_file(): p.touch()
          PY
      - run: npm run build
        env:
          VITE_TEST: '1'
      - run: npm run test:quests
      - run: npm run test:quest-maps
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Mobile and desktop quests with mocked RPCs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/tests/browser-city-quests.cjs')
          s = p.read_text()
          needle = '  return page;'
          assert s.count(needle) == 1
          s = s.replace(needle, "  assert.equal(await page.evaluate(()=>!!window.__game.scene.getScene('game').turnCombat||!!document.getElementById('turn-combat')),false,'Withdrawn combat must be absent');\n" + needle)
          p.write_text(s)
          PY
          node scripts/tests/browser-city-quests.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-screenshots
          path: .cache/quest-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
