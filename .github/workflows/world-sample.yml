name: World map sample

# Cuts small samples out of the Protomaps world map (Zakopane with the Tatras,
# Wawel in Kraków, central Lublin to compare with our own map, and the Szczecin and Gorzów
# station areas, Berlin and Madrid centres) into data/world-sample/,
# for building and testing the world map reader offline.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/world-sample.yml]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/install-pmtiles.sh
      - name: Extract samples
        run: |
          set -euo pipefail
          B=$(scripts/world-latest.sh)
          echo "Build: $B"
          mkdir -p data/world-sample
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/zakopane.pmtiles --bbox=19.80,49.15,20.15,49.33 --maxzoom=15
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/lublin.pmtiles --bbox=22.54,51.23,22.59,51.26 --maxzoom=15
          # Wawel (the QR demo's dream).
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/krakow.pmtiles --bbox=19.915,50.045,19.955,50.065 --maxzoom=15
          # Train arrivals the owner had trouble with (walled-in spot, failed load).
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/szczecin.pmtiles --bbox=14.52,53.40,14.58,53.44 --maxzoom=15
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/gorzow.pmtiles --bbox=15.21,52.71,15.27,52.75 --maxzoom=15
          # Abroad: how the decorations look in Germany and Spain (Berlin Mitte, Madrid centro).
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/berlin.pmtiles --bbox=13.39,52.515,13.42,52.53 --maxzoom=15
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/madryt.pmtiles --bbox=-3.715,40.410,-3.695,40.425 --maxzoom=15
          # The Vistula at Puławy: bridges missing on the world map (bug reports 42, 43).
          pmtiles extract "https://build.protomaps.com/$B" data/world-sample/pulawy.pmtiles --bbox=21.90,51.35,22.00,51.44 --maxzoom=15
          { echo "build $B"; ls -l data/world-sample; pmtiles show data/world-sample/zakopane.pmtiles; } > data/world-sample/info.txt 2>&1
          cat data/world-sample/info.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/world-sample
          git commit -m "World map samples (Protomaps)" || echo "No changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
