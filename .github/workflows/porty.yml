name: Ferry ports

# Ferry lines and ports of the whole world from OpenStreetMap (Overpass) → public/porty.json
# (scripts/promy-osm.mjs). Runs by hand or when the script changes; commits the result.
on:
  workflow_dispatch:
  push:
    # Only on the work branch: merging into the test server's branch must not start another long download.
    branches: [claude/hopeful-davinci-kcj9bh]
    paths: [scripts/promy-osm.mjs, .github/workflows/porty.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # With the list already there only the ports' names are refreshed (delete public/porty.json for a full run).
      - run: if [ -f public/porty.json ]; then node scripts/promy-osm.mjs --rename; else node scripts/promy-osm.mjs --save /tmp/overpass; fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add public/porty.json
          git commit -m "Porty promowe świata z OpenStreetMap (public/porty.json)" || echo "No changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
