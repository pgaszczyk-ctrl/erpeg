name: HUD dungeon interaction checks
on:
  push:
    branches: [chatgpt/hud-a-refine-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          VITE_TEST: '1'
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: node scripts/tests/browser-hud-dungeons.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-dungeon-interactions
          path: work/comic-hud/
