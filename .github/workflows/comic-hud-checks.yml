name: Comic HUD A checks
on:
  pull_request:
    paths:
      - 'src/ui/comic*.ts'
      - 'src/ui/hudLive.ts'
      - 'src/ui/hudTeleskop.ts'
      - 'src/scenes/UIScene.ts'
      - 'src/scenes/GameScene.ts'
      - 'src/objects/Slime.ts'
      - 'scripts/tests/browser-comic-hud.mjs'
      - '.github/workflows/comic-hud-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          VITE_TEST: '1'
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: node scripts/tests/browser-comic-hud.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comic-hud-desktop-and-phone
          path: work/comic-hud/
          if-no-files-found: ignore
