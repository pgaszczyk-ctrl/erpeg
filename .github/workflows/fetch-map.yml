name: Fetch Lublin map data

# Run by hand (Actions tab → "Fetch Lublin map data" → Run workflow) to
# refresh the OpenStreetMap data the game is built from.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-osm.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/lublin-osm.json.gz
          git commit -m "Update Lublin OpenStreetMap data" || echo "No changes"
          git push
