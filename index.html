    <style>
      @font-face { font-family: "Comic Neue"; src: url("./fonts/ComicNeue-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
      html, body { margin: 0; padding: 0; height: 100%; background: #1b2a1b; overflow: hidden; touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { display: block; image-rendering: pixelated; }

      /* The tiny blurred map appears before the game bundle finishes loading. */
      #loading-map { position: fixed; inset: 0; z-index: 8; overflow: hidden; background: #2d190f; touch-action: none; }
      #loading-map[hidden] { display: none; }
      .lm-soft { position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover;
        filter: blur(20px) brightness(.68); }
      .lm-plate { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; margin-left: -640px; margin-top: -360px; opacity: 0; transition: opacity .45s; transform-origin: center; will-change: transform, opacity; }
      .lm-plate img, .lm-plate video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
      @media (orientation: portrait) { .lm-soft { object-position: 51.2% 29.3%; transform: scale(1.8); transform-origin: 51.2% 29.3%; } }
      .lm-shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse, transparent 30%, rgba(22,11,5,.5)); }
      .lm-lamp { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); left: 50%; width: 22px; height: 22px; margin-left: -11px;
        border: 3px solid #dca450; border-top-color: #6d411f; border-radius: 50%; box-shadow: 0 0 12px #d38e3780; animation: lm-turn 2s linear infinite; }
      #loading-map[data-phase="menu"] .lm-lamp { display: none; }
      #loading-map[data-phase="pan"] .lm-plate video, #loading-map[data-phase="zoom"] .lm-plate video { visibility: hidden; }
      .lm-error { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100% - 48px));
        padding: 20px; box-sizing: border-box; background: #291b13; border: 3px solid #dca450; border-radius: 8px;
        color: #f3dfb0; font: 20px 'Alegreya Sans', sans-serif; text-align: center; white-space: pre-line; }
      .lm-error button { min-height: 44px; padding: 10px 18px; border: 2px solid #dca450; border-radius: 5px; background: #6d411f; color: #fff0cb; font: inherit; }
      @keyframes lm-turn { to { transform: rotate(360deg); } }
      /* QR demo: the badge logo fades in at once, before any game code has loaded (owner, 12 Oct 2026). */
      .lm-logo { position: absolute; left: 50%; top: 48%; width: min(62vmin, 420px); height: auto; transform: translate(-50%, -50%);
        filter: drop-shadow(0 8px 10px rgba(0,0,0,.55)); pointer-events: none; opacity: 0; animation: lm-logo-in .7s .3s ease-out forwards; }
      @keyframes lm-logo-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
      #loading-map[data-demo] .lm-lamp { display: none; }
      @media (prefers-reduced-motion: reduce) { .lm-lamp { animation: none; } .lm-plate { transition-duration: .15s; } }

      /* Map screen */
      #minimap { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 10px; background: rgba(0,0,0,0.75); font-family: ui-monospace, Menlo, Consolas, monospace; }
      #minimap canvas { border: 3px solid #f7c531; border-radius: 6px; image-rendering: auto; touch-action: none; cursor: grab; }
      .mm-bar { display: flex; gap: 10px; align-items: center; color: #fff; font-size: 16px; }
      .mm-bar button { font: inherit; font-size: 22px; width: 52px; height: 44px; border: 2px solid rgba(255,255,255,0.6);
        border-radius: 4px; background: #4a4a55; color: #fff; }
      .mm-bar span { min-width: 110px; text-align: center; }
      .mm-hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(90vw, 340px);
        background: #fbf3dc; color: #1e1a24; border: 3px solid #b8892f; border-radius: 8px; padding: 12px 14px;
        display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); font-family: 'Alegreya Sans', sans-serif; }
      .mm-hub b { font-size: 18px; }

      /* Kufer (ui/character.ts): ciemne drewno, mosiądz, nity, lampy nixie, liczniki bębnowe. */

      .k-lt { left: 7px; top: 7px; } .k-rt { right: 7px; top: 7px; } .k-lb { left: 7px; bottom: 7px; } .k-rb { right: 7px; bottom: 7px; }

      .k-tabs { flex: 1; display: flex; gap: 6px; align-items: flex-end; min-width: 0; }
      .k-tab { font: inherit; font-size: 15px; height: 42px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 6px 6px 0 0; cursor: pointer;

      .k-tab-ic { font-size: 18px; }
      .k-tab-on { background: linear-gradient(#f0c46a, #b8893b); color: #2a1c10; border-color: #2a1c10; font-weight: 700; }
      .k-valve { flex: none; align-self: center; width: 50px; height: 50px; box-sizing: border-box; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
        background: radial-gradient(circle at 35% 30%, #f6d98a, #c4913a 60%, #8a5f22); border: 2px solid #5e3f14; box-shadow: 0 0 0 2px #2a1c10, 0 3px 0 #120c08; color: #2a1608; margin-bottom: 4px; }
      .k-valve:active { transform: translateY(2px); box-shadow: 0 0 0 2px #2a1c10, 0 1px 0 #120c08; }
      .k-pipe { flex: none; height: 12px; margin: 0 12px; border-radius: 6px; background: linear-gradient(#f0c46a, #a8742a 50%, #5e3f14); box-shadow: 0 0 0 2px #1a110b; }
      .k-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
      /* Brass slider (character.ts brassScroll): a rail with a valve-wheel knob; the usual scrollbar hidden. */
      .k-body { scrollbar-width: none; padding-right: 34px; } .k-body::-webkit-scrollbar { display: none; }
      .k-rail { position: absolute; right: 8px; width: 16px; border-radius: 8px; touch-action: none; cursor: pointer; z-index: 2;
        background: linear-gradient(90deg, #5e3f14, #a8742a 35%, #f0c46a 50%, #a8742a 65%, #5e3f14); box-shadow: 0 0 0 2px #1a110b, inset 0 0 4px rgba(0,0,0,.5); }
      .k-knob { position: absolute; left: -9px; top: 0; width: 34px; height: 34px; border-radius: 50%; box-sizing: border-box; pointer-events: none;
        background: radial-gradient(circle at 35% 30%, #f6d98a, #c4913a 60%, #8a5f22);
        border: 2px solid #5e3f14; box-shadow: 0 0 0 2px #1a110b, 0 3px 0 #120c08; }
      .k-cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 16px; align-items: start; }
      @media (max-width: 960px) { .k-cols { grid-template-columns: minmax(0, 1fr); } }
      .k-cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
      @media (max-width: 600px) { .k-cols2 { grid-template-columns: minmax(0, 1fr); } }
      .k-well { box-sizing: border-box; background: #1c140e; border: 3px solid #6b4a1f; border-radius: 10px; box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
        padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; min-width: 0; scroll-margin-top: 8px; }
      .k-plate { align-self: flex-start; display: inline-flex; padding: 3px 12px; background: linear-gradient(#e6bb62, #a8742a); color: #2a1c10; border: 2px solid #2a1c10;
        border-radius: 4px; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
      .k-plate.k-small { font-size: 11px; padding: 2px 8px; }
      .k-sub { color: #c9b48a; font-size: 13px; }
      #character .c-skin-pic { display: none; }
      .k-head { color: #f0c46a; font-size: 15px; margin-top: 6px; }
      .k-wrap { --sl: min(54px, 13.5vw); gap: 10px; }
      .k-lewa, .k-prawa { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
      .k-prawa .c-actions { width: 100%; }

        #character .k-top { padding-top: 6px; }

        #character .k-tab { height: 40px; flex-direction: row; gap: 5px; padding: 0 10px; font-size: 13px; }
        #character .k-body { padding-top: 8px; padding-bottom: 6px; }
        #character #k-postac.k-well { padding: 8px 10px; }
        #character .k-card.c-actions, #character .k-card.c-actions:empty { height: min(82px, calc(100dvh - 290px)); padding: 7px 12px; }
        #character .k-wrap { --sl: max(24px, min(44px, 8vw, calc((100dvh - 270px) / 4))); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; column-gap: 18px; gap: 6px 18px; }
        #character .k-lewa, #character .k-prawa { gap: 6px; }

        #character .k-lewa .m-ikbtn img { width: 28px; height: 28px; }
        #character .k-lewa .m-skinrow { gap: 6px; }
        #character .k-lewa .c-skin .c-btn { padding: 4px 12px; min-height: 0; }
      }
      .k-doll { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .k-col { display: flex; flex-direction: column; gap: 8px; }
      .k-tal { display: flex; gap: 8px; justify-content: center; }

      .k-kod-row { display: flex; align-items: center; gap: 8px; }

      .k-kod-title { font-size: 11px; opacity: .75; }

      button.k-kod-code { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }

      .k-kod-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 8px; background: #2a1b0e; border: 1px solid #a8742a; box-shadow: 0 4px 12px rgba(0,0,0,.6); min-width: 210px; }

      .k-kod-opcja { text-align: left; padding: 8px 10px; border-radius: 6px; border: 0; background: #4a3218; color: #f0dfb4; font: 14px 'Alegreya Sans', sans-serif; cursor: pointer; }
      .k-kod-opcja:last-child { background: transparent; color: #b9a988; }

      .k-kod-msg:empty { display: none; }
      .k-dag { padding: 6px; border-radius: 50% 50% 10px 10px / 30% 30% 10px 10px; box-shadow: 0 0 0 3px #1a110b; background: radial-gradient(circle at 30% 20%, #f0c46a, #a8742a 55%, #5e3f14); }
      .k-dag-pic { width: calc(var(--sl) * 2.1); height: calc(var(--sl) * 2.9); box-sizing: border-box; border: 3px solid #1a110b; border-radius: 50% 50% 6px 6px / 28% 28% 6px 6px;

      // QR demo (?d=…): show the logo right away, together with the map wallpaper.
      // The code goes to window.__demoKod (src/demo.ts reads it) and the address bar shows only …/demo
