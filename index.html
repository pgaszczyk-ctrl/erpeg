<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b2a1b" />
    <title>Erpeg</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1b2a1b; overflow: hidden; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { display: block; image-rendering: pixelated; }

      /* Map screen */
      #minimap { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 10px; background: rgba(0,0,0,0.75); font-family: ui-monospace, Menlo, Consolas, monospace; }
      #minimap canvas { border: 3px solid #f7c531; border-radius: 6px; image-rendering: auto; }
      .mm-bar { display: flex; gap: 10px; align-items: center; color: #fff; font-size: 16px; }
      .mm-bar button { font: inherit; font-size: 22px; width: 52px; height: 44px; border: 2px solid rgba(255,255,255,0.6);
        border-radius: 4px; background: #4a4a55; color: #fff; }
      .mm-bar span { min-width: 70px; text-align: center; }

      /* Character sheet */
      #character { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.7); font-family: ui-monospace, Menlo, Consolas, monospace; color: #fff; padding: 12px; box-sizing: border-box; }
      .c-box { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: #1e1a24; border: 3px solid #f7c531;
        border-radius: 6px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; }
      .c-head { display: flex; align-items: baseline; gap: 10px; }
      .c-head h2 { margin: 0; color: #f7c531; font-size: 22px; }
      .c-sub { color: #b8c4b0; flex: 1; }
      .c-close { font: inherit; font-size: 20px; background: none; border: none; color: #fff; }
      .c-stats { font-size: 13px; color: #e8e8e8; line-height: 1.6; }
      .c-note { color: #ffd27a; font-size: 12px; margin: -4px 0 4px; }
      .c-quests { display: flex; flex-direction: column; gap: 4px; }
      .c-quest { display: flex; gap: 8px; align-items: flex-start; background: #0f0d13; border-radius: 4px; padding: 6px 8px; font-size: 14px; }
      .c-qdot { flex: none; width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; border: 2px solid #1e1a24; font-size: 12px; line-height: 14px; text-align: center; }
      .c-qtext { display: flex; flex-direction: column; gap: 2px; } .c-qtext small { color: #d8d8d8; font-size: 12px; }
      .c-box h3 { margin: 8px 0 2px; font-size: 15px; color: #f7c531; }
      .c-eq { display: flex; flex-direction: column; gap: 4px; }
      .c-statlist { display: flex; flex-direction: column; gap: 2px; margin: 4px 0; }
      .c-stat { display: flex; justify-content: space-between; font-size: 14px; color: #e8e8e8; border-bottom: 1px solid #2c2834; padding: 2px 0; }
      .c-stat-v { color: #fff2a8; }
      .c-cross { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 300px; margin: 0 auto;
        grid-template-areas: ". helm ." "bron zbroja dystans" ". buty ."; }
      .c-xcell { font: inherit; aspect-ratio: 1; background: #0f0d13; color: #fff; border: 2px solid #f7c531; border-radius: 6px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; }
      .c-xcell.c-empty { border-color: #4a4a55; border-style: dashed; opacity: 0.6; }
      .c-x-helm { grid-area: helm; } .c-x-bron { grid-area: bron; } .c-x-zbroja { grid-area: zbroja; }
      .c-x-dystans { grid-area: dystans; } .c-x-buty { grid-area: buty; }
      .c-xicon { font-size: 22px; } .c-xname { font-size: 10px; line-height: 1.15; text-align: center; } .c-xpow { font-size: 10px; color: #9aa39a; }
      .c-row { font: inherit; font-size: 14px; display: flex; gap: 8px; text-align: left; background: #0f0d13; color: #fff;
        border: 1px solid #4a4a55; border-radius: 4px; padding: 7px 8px; }
      .c-slot { width: 78px; color: #9aa39a; flex: none; }
      .c-bag { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .c-cell { font: inherit; aspect-ratio: 1; background: #0f0d13; color: #fff; border: 2px solid #4a4a55; border-radius: 4px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; font-size: 11px; }
      .c-empty { border-style: dashed; opacity: 0.5; }
      .c-icon { font-size: 22px; }
      .c-n { font-size: 12px; }
      .item-ico { width: 48px; height: 48px; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
      .item-ghost { filter: grayscale(1) brightness(0.85); opacity: 0.75; }
      .c-cell .item-ico { width: 32px; height: 32px; } .ch-ico { width: 32px; height: 32px; }
      .c-name { font-size: 10px; line-height: 1.2; text-align: center; }
      .c-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .c-actions:empty { display: none; }
      .c-actions-title { width: 100%; font-size: 13px; color: #ffd27a; }
      .c-btn { font: inherit; font-size: 14px; padding: 8px 12px; border: 2px solid rgba(255,255,255,0.5); border-radius: 4px; background: #3fa34d; color: #fff; }
      .c-muted { background: #4a4a55; }
      .c-eat { align-self: flex-start; }
      .c-skill { background: #0f0d13; border-radius: 4px; padding: 6px 8px; }
      .c-skill-name { font-size: 14px; }
      .c-skill-info { font-size: 12px; color: #9aa39a; }
      .c-bar { height: 6px; background: #333; border-radius: 3px; margin-top: 4px; overflow: hidden; }
      .c-fill { height: 100%; background: #f7c531; }

      /* Start screen */
      #menu, .m-screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: rgba(15, 25, 15, 0.82); overflow-y: auto; touch-action: auto; padding: 16px; box-sizing: border-box;
        font-family: ui-monospace, Menlo, Consolas, monospace; color: #fff; -webkit-user-select: text; user-select: text; }
      .m-box { width: 100%; max-width: 380px; background: #1e1a24; border: 3px solid #f7c531; border-radius: 6px;
        padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; margin: auto; }
      .m-box h1 { margin: 0; text-align: center; color: #f7c531; font-size: 34px; letter-spacing: 4px; text-shadow: 3px 3px 0 #000; }
      .m-box h2 { margin: 6px 0 0; font-size: 20px; color: #f7c531; }
      .m-box p { margin: 0; line-height: 1.45; }
      .m-sub { text-align: center; color: #b8c4b0; margin-bottom: 8px !important; }
      .m-field { display: flex; flex-direction: column; gap: 4px; }
      .m-field span { font-size: 14px; color: #d8d8d8; }
      .m-field small, .m-row small { color: #9aa39a; font-size: 12px; line-height: 1.35; }
      .m-field input { font: inherit; font-size: 17px; padding: 10px; border: 2px solid #4a4a55; border-radius: 4px;
        background: #0f0d13; color: #fff; outline: none; }
      .m-upper { text-transform: uppercase; }
      .m-field input:focus { border-color: #f7c531; }
      .m-btn { font: inherit; font-size: 17px; padding: 12px; border: 2px solid rgba(255,255,255,0.5); border-radius: 4px;
        background: #4a4a55; color: #fff; cursor: pointer; }
      .m-btn:disabled { opacity: 0.5; cursor: default; }
      .m-primary { background: #3fa34d; }
      .m-error { color: #ff8a8a; min-height: 0; }
      .m-error:empty { display: none; }
      .m-warn { color: #ffd27a; font-size: 14px; }
      .m-idik { font-size: 38px; letter-spacing: 5px; white-space: nowrap; text-align: center; color: #fff2a8; background: #0f0d13;
        border: 2px dashed #f7c531; padding: 10px; border-radius: 4px; -webkit-user-select: all; user-select: all; }
      .m-list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
      .m-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; background: #0f0d13; border-radius: 4px; }
      .m-row small { grid-column: 1 / -1; }
      .m-card { display: flex; flex-direction: column; gap: 10px; }
      .m-google { background: #fff !important; color: #1f1f1f !important; border-color: #fff !important; }
      .m-or { text-align: center; color: #9aa39a; font-size: 13px; margin: 4px 0 0; }
      .m-check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
      .m-check input { width: 20px; height: 20px; }
      .m-chars { max-height: 55vh; }
      .m-char { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
      .m-char small { color: inherit; opacity: 0.75; font-size: 12px; }
      .m-code-row { display: flex; gap: 8px; justify-content: center; font-size: 18px; }
      .m-qr { align-self: center; border-radius: 4px; max-width: 100%; }
      .m-note { text-align: center; color: #b8c4b0; font-size: 13px; }
      .m-ok { color: #9be39b; }
      .m-pass { display: flex; gap: 6px; }
      .m-geo { color: #ffd27a !important; }
      .m-geo:empty { display: none; }
      .m-pass input { flex: 1; min-width: 0; }
      .m-eye { font-size: 18px; width: 48px; border: 2px solid #4a4a55; border-radius: 4px; background: #0f0d13; color: #fff; }
      .m-remember { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
      .m-input { font: inherit; font-size: 17px; padding: 10px; border: 2px solid #4a4a55; border-radius: 4px; background: #0f0d13; color: #fff; outline: none; }
      .m-ghostwrap { position: relative; align-self: center; width: 300px; max-width: 100%; }
      .m-deathmap { display: block; width: 100%; aspect-ratio: 1; border: 3px solid #8d8f99; border-radius: 6px; }
      .m-ghost { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -70%); animation: m-float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgba(220,220,255,0.9)); }
      @keyframes m-float { 0%, 100% { transform: translate(-50%, -70%); } 50% { transform: translate(-50%, -95%); } }
      .ch-box { max-width: 460px; gap: 8px; touch-action: none; }
      .ch-coins { font-size: 15px; color: #fff2a8; }
      .ch-money { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .ch-amount { width: 90px; padding: 7px; font-size: 15px; }
      .ch-msg { color: #ff8a8a; font-size: 13px; min-height: 1em; }
      .ch-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
      .ch-bag { grid-template-columns: repeat(5, 1fr); max-width: 230px; }
      .ch-cell { position: relative; aspect-ratio: 1; background: #0f0d13; border: 2px solid #4a4a55; border-radius: 4px;
        display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none; cursor: grab; }
      .ch-empty { border-style: dashed; opacity: 0.55; cursor: default; }
      .ch-icon { font-size: 18px; line-height: 1; pointer-events: none; }
      .ch-n { position: absolute; right: 1px; bottom: 0; font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000; pointer-events: none; }
      .ch-ghost { position: fixed; z-index: 20; pointer-events: none; font-size: 28px; transform: translate(-50%, -60%); filter: drop-shadow(0 2px 3px #000); }
      .ch-info { font-size: 13px; color: #b8c4b0; min-height: 2.6em; }
      .m-namerow { display: flex; gap: 12px; align-items: flex-end; }
      .m-namerow .m-field { flex: 1; min-width: 0; }
      .m-hero { width: 144px; height: 60px; image-rendering: pixelated; background: #6abe30; border: 2px solid #4a4a55; border-radius: 4px; flex: none; }
      .m-look { display: flex; flex-direction: column; gap: 4px; background: #15121a; border-radius: 4px; padding: 8px; }
      .m-slide { display: grid; grid-template-columns: 96px 1fr 92px; gap: 8px; align-items: center; font-size: 13px; color: #d8d8d8; }
      .m-range { width: 100%; accent-color: #f7c531; }
      .m-val { font-size: 13px; color: #fff2a8; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .m-swatch { justify-self: end; width: 40px; height: 18px; border: 2px solid #fff; border-radius: 3px; }
      .m-level { grid-template-columns: 1fr 96px; }
      .m-share { background: #25a55f; }
      .m-link { background: none; border: none; color: #9ac7ff; font: inherit; font-size: 14px; text-decoration: underline; padding: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
