<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Exp-lore – panel admina</title>
    <style>
      :root { --bg: #15121a; --box: #1e1a24; --line: #3a3544; --gold: #f7c531; --text: #eee; --muted: #9aa39a; --ok: #5ac85a; --bad: #ff8a8a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px; background: var(--box); border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 2; }
      header h1 { margin: 0 12px 0 0; font: bold 20px ui-monospace, monospace; color: var(--gold); letter-spacing: 2px; }
      header button.tab { background: none; border: 1px solid transparent; color: var(--text); padding: 6px 10px; border-radius: 4px; font: inherit; cursor: pointer; }
      header button.tab.on { border-color: var(--gold); color: var(--gold); }
      main { padding: 14px; max-width: 1200px; margin: 0 auto; }
      h2 { color: var(--gold); margin: 6px 0 12px; font-size: 18px; }
      h3 { margin: 14px 0 6px; font-size: 15px; color: var(--gold); }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .tile { background: var(--box); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
      .tile b { display: block; font-size: 24px; color: var(--gold); }
      .tile span { color: var(--muted); font-size: 13px; }
      .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
      table { border-collapse: collapse; width: 100%; background: var(--box); }
      th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
      th { cursor: pointer; user-select: none; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--box); }
      th.num, td.num { text-align: right; }
      /* 🧠 Quizy: question and answers wrap so the whole row (with 🗑) fits; on phones each question is a little card. */
      table.qz td.q, table.qz td.a { white-space: normal; min-width: 160px; }
      table.qz td.del { width: 1%; }
      table.qz .b { padding: 4px 8px; }
      .qzf { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .qzf input { flex: 1 1 180px; }
      @media (max-width: 700px) {
        table.qz thead { display: none; }
        table.qz, table.qz tbody { display: block; }
        table.qz tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
        table.qz td { border: 0; padding: 0; white-space: normal; }
        table.qz td.q { order: 1; flex: 1 1 100%; font-weight: 600; min-width: 0; }
        table.qz td.a { order: 2; flex: 1 1 100%; min-width: 0; }
        table.qz td.lv, table.qz td.cat, table.qz td.when { order: 3; color: var(--muted); font-size: 13px; }
        table.qz td.num { order: 3; color: var(--muted); font-size: 13px; }
        table.qz td.num::before { content: 'odp. '; }
        table.qz td.land { order: 4; margin-left: auto; }
        table.qz td.del { order: 5; width: auto; }
      }
      tr.click { cursor: pointer; }
      tr.click:hover td { background: #29233a; }
      .muted { color: var(--muted); }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; background: #333; }
      .card { background: var(--box); border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin: 12px 0; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
      @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
      label.f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
      label.f > span { color: var(--muted); font-size: 13px; }
      input, select, textarea { font: inherit; padding: 7px 8px; background: #0f0d13; color: #fff; border: 1px solid #4a4a55; border-radius: 4px; }
      textarea { min-height: 80px; resize: vertical; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
      button.b { font: inherit; padding: 7px 12px; border-radius: 4px; border: 1px solid #666; background: #4a4a55; color: #fff; cursor: pointer; }
      button.b.p { background: #3fa34d; border-color: #6fc57a; }
      button.b:disabled { opacity: 0.5; }
      .msg { min-height: 1.4em; }
      .dialog { background: #1e1a24; border: 3px solid var(--gold); border-radius: 6px; padding: 12px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
      .dialog .t { color: var(--gold); font-weight: bold; margin-bottom: 6px; }
      .dialog .btns { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
      .dialog .btns div { background: #3f7fd8; padding: 6px; text-align: center; border-radius: 3px; }
      canvas.map { width: 100%; max-width: 420px; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 6px; display: block; }
      .legend { font-size: 12px; color: var(--muted); margin-top: 4px; }
      #login { max-width: 360px; margin: 60px auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/admin.ts"></script>
  </body>
</html>
